html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--label);font:17px/1.3 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:8px}
img{max-width:100%}
.ic{display:block;flex:none}
/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--barline)}
.nav-in{max-width:600px;margin:0 auto;height:48px;display:flex;align-items:center;padding:0 8px;position:relative}
body.wide .nav-in{max-width:1120px}
.nav-back{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--tint);font-size:17px;padding:8px 6px}
.nav-title{font-weight:600;font-size:17px;position:absolute;left:50%;transform:translateX(-50%)}
.clock{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--tint-soft);color:var(--tint);border:0;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
main{max-width:600px;margin:0 auto;padding:6px 16px 40px}
body.wide main{max-width:1120px}
body.has-tabs main{padding-bottom:110px}
/* titles */
.lt{font-family:var(--font-s);font-size:36px;line-height:42px;font-weight:700;letter-spacing:0;margin:8px 0 6px}
.serif{font-family:var(--font-s);font-weight:700;letter-spacing:0}
.welcome-title{font-size:44px;line-height:50px;font-weight:800;margin-bottom:12px}
.sub{color:var(--label2);font-size:15px;line-height:20px}
.center{text-align:center}
.title2{font-family:var(--font-d);font-size:22px;line-height:28px;font-weight:700}
.title3{font-size:20px;line-height:25px;font-weight:600}
.headline{font-weight:600}
.fn{font-size:13px;line-height:18px;color:var(--label2)}
.l2{color:var(--label2)}
/* grouped lists */
.sec{margin-top:26px}
.sec:first-child{margin-top:12px}
.gh{font-size:13px;line-height:18px;font-weight:400;color:var(--label2);padding:0 16px 7px;letter-spacing:0}
.gf{font-size:13px;line-height:18px;color:var(--label2);padding:7px 16px 0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:11px 16px;background:none;border:0;text-align:left;font-size:17px;color:var(--label);text-decoration:none}
.group>*+*::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep);transform:scaleY(.999)}
.tap{cursor:pointer}
.tap:active{background:var(--fill)}
.tap:disabled{cursor:default}.tap:disabled .cc,.tap:disabled .tile{opacity:.4}
.cc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cc .s{font-size:14px;line-height:18px;color:var(--label2)}
.val{color:var(--label2);text-align:right;font-variant-numeric:tabular-nums}
.val.strong{color:var(--label);font-weight:600}
.chev{color:var(--label3)}
.check{color:var(--tint)}
.tint{color:var(--tint)}.red{color:var(--red)}.green{color:var(--green)}
.tile{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.cell.field{padding-top:0;padding-bottom:0;cursor:text}
.cell.field .fl{flex:none;width:118px}
.cell.field input,.cell.field select{flex:1;min-width:0;border:0;background:none;padding:12px 0;min-height:46px;font-size:17px;outline:none;text-align:left}
.cell.field select{text-align:right;text-align-last:right;color:var(--label2);-webkit-appearance:none;appearance:none;cursor:pointer}
.cell.field input::placeholder{color:var(--label3)}
.cell.field:focus-within{background:transparent}
.cell.field input:focus-visible,.cell.field select:focus-visible{outline:none}
.cell.field:has(:focus-visible){box-shadow:inset 0 0 0 2px var(--tint)}
/* controls */
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:31px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:14px;font-weight:500;min-height:32px;color:var(--label)}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.stepper{display:inline-flex;background:var(--fill);border-radius:9px;overflow:hidden;flex:none}
.stepper button{border:0;background:none;width:48px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--label)}
.stepper button+button{border-left:.5px solid var(--sep)}
.stepper button:active{background:var(--fill2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--tint);color:#fff;font-size:17px;font-weight:600;padding:0 20px;text-decoration:none}
.btn:active{filter:brightness(.9)}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.sm{min-height:34px;width:auto;border-radius:999px;font-size:15px;padding:0 14px}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--fill);color:var(--label2)}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.red{background:var(--red-soft);color:var(--red)}.pill.orange{background:var(--orange-soft);color:var(--orange)}.pill.tint{background:var(--tint-soft);color:var(--tint)}
.err{color:var(--red);font-size:15px;padding:10px 16px 0}
/* welcome */
.appicon{width:108px;height:108px;border-radius:24px;margin:22px auto 12px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 10px 30px rgba(13,102,159,.22),0 0 0 .5px rgba(0,0,0,.08)}
.appicon img{width:84px;height:auto;display:block}
.byline{font-size:13px;font-weight:600;color:#0D669F;text-align:center;margin-top:-6px;margin-bottom:8px;letter-spacing:.02em}
:root[data-theme="dark"] .byline{color:#5AB0E8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .byline{color:#5AB0E8}}
img.tile{object-fit:cover;padding:0}
.pass .mark{width:26px;height:auto;filter:brightness(0) invert(1)}
.choice{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:0;border-radius:16px;padding:16px;text-align:left}
.choice+.choice{margin-top:10px}
.choice:active{background:var(--raised);filter:brightness(.97)}
.choice .tile{width:48px;height:48px;border-radius:12px}
/* seat ring */
.ring .tbl{fill:var(--fill)}
.ring .s-empty{fill:none;stroke:var(--label3);stroke-width:1.5}
.ring .s-held{fill:var(--tint)}.ring .s-conf{fill:var(--green)}.ring .s-in{fill:var(--orange)}
.ring text{fill:var(--label);font-family:var(--font-r);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--label2);padding:0 16px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.tcard{display:flex;gap:16px;align-items:center;padding:16px}
.meter{height:6px;background:var(--fill);border-radius:99px;overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--tint);border-radius:99px}
/* avatars */
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;font-family:var(--font-r);font-weight:600;background:linear-gradient(180deg,#A6ACB8,#858A96)}
.faces{display:flex;gap:14px;overflow-x:auto;padding:14px 16px}
.face{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:56px;font-size:13px;text-align:center}
/* wallet pass */
.pass{border-radius:18px;padding:18px 18px 20px;color:#fff;background:linear-gradient(155deg,#1C8AD6 0%,#0D669F 55%,#0A4A75 100%);box-shadow:0 12px 30px rgba(13,102,159,.3);margin-top:12px}
.pass .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;opacity:.95}
.pass .lbl{font-size:12px;opacity:.75;font-weight:500}
.pass .code{font-family:var(--font-r);font-size:32px;font-weight:700;letter-spacing:.01em;margin-top:2px}
.pass .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pass .fields b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.qrbox{background:#fff;border-radius:12px;padding:12px;display:flex;justify-content:center;margin:18px auto 0;width:max-content}
.qrbox img,.qrbox canvas{display:block}
.pass .faces{padding:14px 0 0;justify-content:center}
.pass .face{color:#fff}
/* status card */
.status{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.status .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.status .btns{margin-top:12px;flex-direction:row;flex-wrap:wrap}
.status .btns .btn{width:auto;flex:1;min-height:44px;min-width:140px}
/* gate */
.gatebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gatebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;border-radius:18px;border:0;font-size:18px;font-weight:600;background:var(--card);color:var(--label)}
.gatebtn .tile{width:58px;height:58px;border-radius:16px}
.gatebtn:active{filter:brightness(.95)}
.result{border-radius:20px;padding:22px 20px;color:#fff;text-align:center}
.result.ok{background:var(--green)}.result.no{background:var(--red)}
.result .big-ic{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.result h2{font-family:var(--font-d);font-size:30px;line-height:36px;font-weight:700}
.result p{font-size:17px;margin-top:6px;opacity:.95}
.result .faces{justify-content:center;padding:14px 0 0}
.result .face{color:#fff}
.result .btn{background:rgba(255,255,255,.22);color:#fff;margin-top:16px}
.result .enrol{background:rgba(0,0,0,.14);border-radius:12px;padding:12px;margin-top:14px}
.result .enrol .btn{margin-top:0;background:#fff;color:#000;width:auto;min-height:36px;border-radius:999px;font-size:15px}
/* ops */
.hero-num{background:var(--card);border-radius:16px;padding:18px}
.big{font-family:var(--font-r);font-size:56px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--font-r);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{color:var(--label2);font-size:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;min-width:680px;font-size:15px}
table.t th,table.t td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:.5px solid var(--sep)}
table.t th{font-size:13px;color:var(--label2);font-weight:500}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t tr.tot td{font-weight:600;background:var(--fill)}
table.t input{width:80px;border:0;background:var(--fill);border-radius:8px;padding:6px 8px;text-align:right}
.bars{padding:6px 16px 12px}
.bars>div{display:grid;grid-template-columns:128px 1fr 30px;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.bars .b{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bars .b i{display:block;height:100%;border-radius:99px}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
/* timeline */
.tl .cell{align-items:flex-start}
.tl .n{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--label2);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.tl .done .n{background:var(--tint-soft);color:var(--tint)}
.tl .now .n{background:var(--tint);color:#fff}
.tl .now .headline{color:var(--tint)}
/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:6px}
.sheet-head .title{font-weight:600}
.sheet-head .done{justify-self:end;background:none;border:0;color:var(--tint);font-weight:600;padding:6px}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:14px;padding-bottom:24px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:60;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--label);padding:12px 16px;border-radius:16px;width:max-content;max-width:min(92vw,440px);font-size:15px;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
.toast[hidden]{display:none}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin-top:4px;cursor:text}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;-webkit-appearance:none;appearance:none}
.search:focus-within{box-shadow:0 0 0 2px var(--tint)}
.search input::placeholder{color:var(--label2)}
.toast .tile{width:26px;height:26px;border-radius:7px}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--label2);animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.scan .fp{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.video{background:#000;color:#fff;border-radius:14px;aspect-ratio:16/10;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.live{position:absolute;top:12px;left:12px;background:#FF3B30;color:#fff;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--barline);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:flex}
body.wide .tabs-in{max-width:1120px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 7px;font-size:10.5px;font-weight:500;background:none;border:0;color:var(--gray);letter-spacing:.01em}
.tabs button[aria-current="true"]{color:var(--tint)}
.photo-in{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:560px){.nav-title{display:none}}
@media (max-width:380px){.gatebtns{grid-template-columns:1fr}.cell.field .fl{width:100px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* Accessibility & contrast improvements */
:root{
  --label:#0B0B0B;--label2:rgba(11,11,11,.62);--label3:rgba(11,11,11,.36);--barline:rgba(0,0,0,.06);--tint-soft:rgba(10,132,255,.12);
}
:root[data-theme="dark"]{
  --label:#FFFFFF;--label2:rgba(255,255,255,.78);--label3:rgba(255,255,255,.42);--barline:rgba(255,255,255,.08);--tint-soft:rgba(10,132,255,.22);
}
/* stronger, high-contrast focus for keyboard users */
:focus-visible{outline:4px solid #FFB703;outline-offset:3px;border-radius:8px}
/* skip link for screen readers / keyboard users */
.skip{position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;background:var(--card);color:var(--label);padding:8px 12px;border-radius:6px;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,0.12)}
/* ensure disabled buttons remain perceivable */
button[aria-disabled="true"],button:disabled{opacity:.6}
</style>
</head>
<body>
<a href="#view" class="skip">Skip to content</a>
<header class="nav" id="top" role="banner"></header>
<main id="view" role="main"></main>
<nav class="tabs" id="tabs" aria-label="Sections" role="navigation"></nav>
<div id="sheet"></div>

function isoDate(d){return d.toISOString().slice(0,10);}

/* ---------- state ---------- */
function fresh(){return {v:11,week:1,phase:0,cfg:{platePrice:3000,recipe:JSON.parse(JSON.stringify(DEFAULT_RECIPE)),farmChickens:0},
  hosts:[],sps:[],families:{},guests:{},list:{},standby:[],notes:[],history:[],
  counters:{fam:{},tab:{}},halls:DEFAULT_HALLS.map(h=>Object.assign({},h)),
  wk:newWk(),locked:false,snap:{},
  me:{hostId:null,family:null,evId:'EV-CHIDI',usherId:'HD-YAB-01'},
  gate:{loc:'YAB',offline:false,queue:[],lastSync:'Fri 18:05'}};}
function newWk(){return {released:0,paused:0,noShow:0,atPing:0,offersLapsed:0,dinedFam:0,dinedGuests:0,regs:{self:0,evangelist:0,hall:0},ev:{}};}
let S;
function load(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===11){if(!o.halls)o.halls=[];DEFAULT_HALLS.forEach(h=>{if(!o.halls.some(x=>x.id===h.id))o.halls.push(Object.assign({},h));});return o;}}}catch(e){}return null;}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}

/* ---------- domain ---------- */
const phaseKey=()=>PHASES[S.phase].key;
const regOpen=()=>[P.MON,P.WED,P.THU12].includes(S.phase);
function hostOf(sp){return S.hosts.find(h=>h.id===sp.hostId)||{name:'Host'};}
function hostLabel(sp,forGuest){const h=hostOf(sp);if(sp.anon==='open')return h.name;if(sp.anon==='first_name')return firstName(h.name);return forGuest?'a GTN host':'Anonymous';}
function tableLabel(sp){const h=hostOf(sp);if(sp.anon==='open')return h.name+"'s table";if(sp.anon==='first_name')return firstName(h.name)+"'s table";return 'GTN host table';}
function spById(id){return S.sps.find(s=>s.id===id);}
function activeSps(loc){return S.sps.filter(s=>(!loc||loc==='ALL'||s.loc===loc)&&s.start<=S.week&&S.week<s.start+s.weeks);}
const entries=()=>Object.values(S.list);
const holds=e=>e.conf!=='paused'&&e.conf!=='released';
function seatsAt(tid,pred){let n=0;for(const e of entries())if(pred(e))for(const a of e.alloc)if(a.t===tid)n+=a.seats;return n;}
const used=tid=>seatsAt(tid,holds);
const freeAt=sp=>sp.cap-used(sp.id);
function allocate(f){
  const n=f.members.length;
  const tabs=activeSps(f.loc).map(s=>({s,fr:freeAt(s)})).filter(x=>x.fr>0);
  const fit=tabs.filter(x=>x.fr>=n).sort((a,b)=>a.fr-b.fr)[0];
  if(fit)return [{t:fit.s.id,seats:n}];
  if(tabs.reduce((a,x)=>a+x.fr,0)<n)return null;
  tabs.sort((a,b)=>b.fr-a.fr);let left=n;const out=[];
  for(const x of tabs){if(!left)break;const k=Math.min(left,x.fr);out.push({t:x.s.id,seats:k});left-=k;}
  return out;}
function prio(f){if(f.missCount>0)return Math.min(3,f.missCount+1);if(f.timesDined>0||f.keepP1)return 1;return 4;}
const prioLabel=p=>p===4?'New':'P'+p;
function inStandby(code){return S.standby.includes(code);}
function toStandby(code){if(!inStandby(code))S.standby.push(code);}
function fromStandby(code){S.standby=S.standby.filter(c=>c!==code);}
function seat(f,conf,src){
  const alloc=allocate(f);
  if(!alloc){toStandby(f.code);return false;}
  S.list[f.code]={code:f.code,loc:f.loc,alloc,priority:prio(f),conf,gate:'not_entered',src,time:null,outcome:null};
  fromStandby(f.code);return true;}
function fillFromStandby(){
  if(!regOpen())return;
  const q=S.standby.slice().sort((a,b)=>prio(S.families[a])-prio(S.families[b])||S.families[a].created-S.families[b].created);
  for(const code of q){const f=S.families[code];if(!f||f.status==='removed'){fromStandby(code);continue;}
    const conf=S.phase===P.MON?'reserved':'offered';
    if(seat(f,conf,'standby')){
      note('fam:'+code,conf==='offered'?'A seat opened for you this Saturday at '+LOC(f.loc).name+'. Confirm by Thursday 18:00 to keep it.':'A seat is now reserved for you this Saturday. We will ask you to confirm on Wednesday.');}}}
function fpOwner(fp){for(const g of Object.values(S.guests)){if(g.fp&&g.fp===fp){const f=S.families[g.fam];if(f&&f.status!=='removed')return {g,f};}}return null;}
function channelFor(f){return f.source==='self'?'App':f.phone?'SMS':'Evangelist follow-up';}
function note(to,text){S.notes.unshift({id:uid('n'),to,text,week:S.week,phase:S.phase,channel:to.startsWith('fam:')?channelFor(S.families[to.slice(4)]||{}):'Push'});if(S.notes.length>400)S.notes.length=400;}

function registerFamily(r){
  const loc=r.loc;S.counters.fam[loc]=(S.counters.fam[loc]||0)+1;
  const code='FAM-'+loc+'-'+pad(S.counters.fam[loc],4);
  const ids=r.members.map(m=>{const id=uid('g');S.guests[id]={id,fam:code,first:m.first.trim(),photo:m.photo,fp:m.child?null:m.fp,fpStatus:m.child?'exempt':(m.fp?'enrolled':'pending'),skillDo:m.skillDo,skillLearn:m.skillLearn};return id;});
  const f={code,loc,members:ids,phone:r.phone.trim(),source:r.source,regBy:r.source==='evangelist'?S.me.evId:r.source==='hall'?S.me.usherId:null,
    created:Date.now()+Math.random(),week:S.week,status:'active',missCount:0,timesDined:0,keepP1:false,pauseStreak:0,streak:0,maxStreak:0,nextWeek:null,intent:null,
    consentHost:!!r.consentHost,consentLive:!!r.consentLive};
  S.families[code]=f;
  S.wk.regs[r.source]=(S.wk.regs[r.source]||0)+1;
  if(r.source==='evangelist'){const k=S.me.evId+'|'+PHASES[S.phase].day;S.wk.ev[k]=(S.wk.ev[k]||0)+1;}
  const conf=S.phase>=P.WED?'confirmed':'reserved';
  const ok=seat(f,conf,'new');
  const where=LOC(loc).hall;
  if(ok)note('fam:'+code,'Welcome to GTN Dining. Your family code is '+code+'. '+fmtDate(satDate(S.week))+', 12:30pm at '+where+'. '+(conf==='confirmed'?'You are confirmed.':'We will ask you to confirm on Wednesday.'));
  else note('fam:'+code,'Your family code is '+code+'. '+(activeSps(loc).length?'All seats at '+LOC(loc).name+' are taken for now.':'No host has a table at '+LOC(loc).name+' yet.')+' You are on standby and will hear from us if a seat opens.');
  return code;}

function confirmSeat(code){const e=S.list[code],f=S.families[code];if(!e||!f)return false;
  if(!['reserved','offered'].includes(e.conf))return false;
  if(e.conf==='reserved'&&![P.WED,P.THU12].includes(S.phase))return false;
  e.conf='confirmed';f.pauseStreak=0;return true;}
function pauseSeat(code){const e=S.list[code],f=S.families[code];if(!e||!f)return false;
  if(!['reserved','offered','confirmed'].includes(e.conf)||S.phase>P.THU12||S.phase<P.MON)return false;
  e.conf='paused';f.keepP1=f.missCount===0;f.nextWeek='seat';f.pauseStreak++;f.status='paused';S.wk.paused++;
  if(f.pauseStreak>=3){f.missCount++;f.pauseStreak=0;f.status='missed';note('fam:'+code,'Third pause in a row: counted as a missed Saturday.');}
  fillFromStandby();return true;}
function setIntent(code,v){const f=S.families[code];if(f)f.intent=v;}

/* ---------- weekly jobs ---------- */
function jobMonday(){
  const fams=Object.values(S.families).filter(f=>f.status!=='removed');
  const cands=fams.filter(f=>f.nextWeek==='seat').sort((a,b)=>prio(a)-prio(b)||a.created-b.created);
  fams.filter(f=>f.nextWeek==='skip').forEach(f=>{f.nextWeek='seat';});
  let seated=0,waiting=0;
  for(const f of cands){f.nextWeek=null;if(seat(f,'reserved','returning'))seated++;else waiting++;}
  return seated+' returning families seated'+(waiting?', '+waiting+' on standby':'')+'. Registration is open.';}
function jobWed(){let n=0;for(const e of entries())if(e.conf==='reserved'){n++;note('fam:'+e.code,'Will you come on '+fmtDate(satDate(S.week))+' at 12:30pm? Confirm or pause in the app, or reply 1 to confirm, 2 to pause.');}
  S.wk.atPing=entries().filter(holds).length;return n+' families asked to confirm.';}
function jobThu12(){let rel=0;
  for(const e of entries())if(e.conf==='reserved'){e.conf='released';rel++;S.wk.released++;const f=S.families[e.code];f.missCount++;f.keepP1=false;
    if(f.missCount>=3){f.status='removed';f.nextWeek=null;note('fam:'+f.code,'You missed 3 Saturdays without dining, so your family was removed. You are welcome to register again.');}
    else{f.status='missed';f.nextWeek='seat';note('fam:'+f.code,'You did not confirm, so your seat was released. You are on the list again next Monday.');}}
  const before=S.standby.length;fillFromStandby();
  return rel+' released. '+(before-S.standby.length)+' standby families offered seats.';}
function jobThu18(){let lapsed=0;
  for(const e of entries())if(e.conf==='offered'){e.conf='released';e.lapsed=true;lapsed++;S.wk.offersLapsed++;S.families[e.code].nextWeek='seat';}
  for(const code of S.standby){const f=S.families[code];if(f){f.nextWeek='seat';note('fam:'+code,'No seat opened this week. You will be considered again on Monday.');}}
  S.standby=[];S.snap={};let credited=0;
  for(const sp of activeSps()){const cook=seatsAt(sp.id,e=>e.conf==='confirmed');const unused=sp.cap-cook;
    S.snap[sp.id]={cook,seated:used(sp.id),unused};sp.credit=(sp.credit||0)+unused;credited+=unused;
    if(unused>0)note('host:'+sp.hostId,'Table '+sp.id+': '+cook+' of '+sp.cap+' plates confirmed. '+unused+' unused plate'+(unused>1?'s':'')+' credited to your account.');}
  S.locked=true;
  const total=Object.values(S.snap).reduce((a,x)=>a+x.cook,0);
  return 'Locked. Cook '+total+' plates. '+credited+' unused plates credited to hosts.';}
function jobGate(){for(const sp of activeSps())if(S.snap[sp.id]&&S.snap[sp.id].cook>0)note('host:'+sp.hostId,'Your table '+sp.id+' is about to dine at '+LOC(sp.loc).name+'. Watch live from 13:00.');S.gate.lastSync='Fri 18:05';return 'Gate open at every hall until 12:45.';}
function jobDine(){return 'Gate closed. Live streams running.';}
function jobThanks(){let d=0,ns=0;const dinedTables=new Set();
  for(const e of entries()){if(e.conf!=='confirmed')continue;const f=S.families[e.code];
    if(e.gate==='entered'){e.outcome='dined';d++;f.timesDined++;f.missCount=0;f.status='active';f.intent='yes';f.keepP1=false;f.pauseStreak=0;f.streak++;f.maxStreak=Math.max(f.maxStreak,f.streak);
      S.wk.dinedFam++;S.wk.dinedGuests+=f.members.length;e.alloc.forEach(a=>dinedTables.add(a.t));
      note('fam:'+e.code,'Thank you for coming. We have reserved you for next Saturday. Change this in the app, or reply 2 to pause, 3 to remove.');}
    else{e.outcome='no_show';ns++;S.wk.noShow++;f.missCount++;f.streak=0;f.keepP1=false;
      if(f.missCount>=3){f.status='removed';f.nextWeek=null;}else{f.status='missed';f.nextWeek='seat';}
      note('fam:'+e.code,'You confirmed but did not come. Food was cooked for you. Missed count: '+f.missCount+' of 3.');}}
  for(const id of dinedTables){const sp=spById(id);if(sp){(sp.dined=sp.dined||[]).push(S.week);note('host:'+sp.hostId,'Your guests at table '+id+' left a thank-you video.');}}
  return d+' families dined, '+ns+' no-shows.';}
function closeWeek(){
  for(const e of entries()){const f=S.families[e.code];if(!f||e.outcome!=='dined')continue;
    if(f.intent==='remove'){f.status='removed';f.nextWeek=null;}
    else if(f.intent==='pause'){f.nextWeek='skip';f.keepP1=true;f.status='paused';f.pauseStreak++;S.wk.paused++;if(f.pauseStreak>=3){f.missCount++;f.pauseStreak=0;f.status='missed';}}
    else{f.nextWeek='seat';}}
  const act=activeSps();
  S.history.push({week:S.week,date:isoDate(satDate(S.week)),tablesPaid:act.length,
    tablesFilled:act.filter(sp=>S.snap[sp.id]&&S.snap[sp.id].seated>=sp.cap).length,
    tablesDined:act.filter(sp=>(sp.dined||[]).includes(S.week)).length,
    seatsPaid:act.reduce((a,s)=>a+s.cap,0),cook:Object.values(S.snap).reduce((a,x)=>a+x.cook,0),
    atPing:S.wk.atPing,released:S.wk.released,paused:S.wk.paused,noShow:S.wk.noShow,dinedGuests:S.wk.dinedGuests,
    regs:S.wk.regs,ev:S.wk.ev});
  S.week++;S.phase=P.SUN;S.list={};S.standby=[];S.locked=false;S.snap={};S.wk=newWk();S.gate.queue=[];
  return 'Week closed. New giving window for '+fmtDate(satDate(S.week))+'.';}
function advance(){
  let msg;
  if(S.phase===P.THANKS){msg=closeWeek();}
  else{S.phase++;const k=phaseKey();
    msg=({MON:jobMonday,WED:jobWed,THU12:jobThu12,THU18:jobThu18,GATE:jobGate,DINE:jobDine,THANKS:jobThanks}[k]||(()=>'Preparation day.'))();}
  save();return msg;}

/* ---------- hosts & tables ---------- */
function createHost(name,email,country){const h={id:uid('h'),name:name.trim(),email:email.trim(),country:country.trim()};S.hosts.push(h);return h;}
function targetWeek(){return S.phase<=P.THU12?S.week:S.week+1;}
function createTable(hostId,o){
  S.counters.tab[o.loc]=(S.counters.tab[o.loc]||0)+1;const id=o.loc+'-T'+pad(S.counters.tab[o.loc],2);
  const d=DURS.find(x=>x.id===o.dur);
  const sp={id,hostId,loc:o.loc,cap:o.cap,dur:o.dur,weeks:d.weeks,start:targetWeek(),anon:o.anon,provider:o.prov,
    amount:o.cap*d.weeks*S.cfg.platePrice,credit:0,dined:[],blessing:{},created:Date.now()};
  S.sps.push(sp);
  if(sp.start===S.week)fillFromStandby();
  return sp;}
function spStatus(sp){
  if(S.week<sp.start)return {k:'upcoming',label:'Starts '+fmtDate(satDate(sp.start))};
  if(S.week>=sp.start+sp.weeks)return {k:'completed',label:'Completed'};
  if(S.phase>=P.THANKS&&(sp.dined||[]).includes(S.week))return {k:'dined',label:'Dined today'};
  if(S.locked)return {k:'locked',label:'Locked for Saturday'};
  const u=used(sp.id);
  if(u===0)return {k:'empty',label:'Waiting for guests'};
  if(u<sp.cap)return {k:'filling',label:'Filling'};
  return {k:'full',label:'Full'};}

function ring(cap,held,conf,entered,size){size=size||96;const c=size/2;

    return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+held+' of '+cap+' seats"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--fill)" stroke-width="8"/><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--tint)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(L*pct).toFixed(1)+' '+L.toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/><text x="'+c+'" y="'+(c+size*.06)+'" text-anchor="middle" font-size="'+(size*.17)+'">'+held+'/'+cap+'</text></svg>';}
  const rT=size*.28,rS=Math.max(3.6,Math.min(size*.072,(Math.PI*size*.4)/cap*.36)),rO=size/2-rS-2;
  let s='<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+held+' of '+cap+' seats taken, '+conf+' confirmed"><circle class="tbl" cx="'+c+'" cy="'+c+'" r="'+rT+'"/>';
  for(let i=0;i<cap;i++){const a=-Math.PI/2+i*2*Math.PI/cap;const cls=i<entered?'s-in':i<conf?'s-conf':i<held?'s-held':'s-empty';

function weekStatusV(f,e){
  const sc=statusCard;
  if(f.status==='removed'&&!e)return sc('var(--red)','x','Removed','Your family missed 3 Saturdays without dining. Register again to return.');
  if(S.phase===P.THANKS&&e&&e.outcome==='dined'){const c=f.intent||'yes';
    return '<div class="status" style="display:block"><p class="title2 serif" style="font-size:26px;line-height:32px">Thank you for coming</p><p class="sub" style="margin-top:2px">What about next Saturday?</p></div>'+
    sec('',selRow('intent','yes',c,'Yes, reserve me next week','Selected unless you change it')+selRow('intent','pause',c,'Pause next week','Your place is kept for the week after')+selRow('intent','remove',c,'Remove me','You can register again any time'));}
  if(e&&e.outcome==='no_show')return sc('var(--red)','x','You confirmed but did not come','Food was cooked for your family. Missed count: '+f.missCount+' of 3.');
  if(!e){if(inStandby(f.code))return sc('var(--orange)','hourglass','On standby',(activeSps(f.loc).length?'All seats are taken.':'No host has a table at '+esc(LOC(f.loc).name)+' yet.')+' We will message you if one opens before Thursday 18:00.');
    if(f.nextWeek==='skip'||(f.status==='paused'&&S.phase<P.MON))return sc('var(--indigo)','pause','Pausing','You chose to skip this Saturday. You are back on the list after that.');
    if(S.phase===P.SUN)return sc('var(--tint)','clock','Waiting for Monday',f.nextWeek==='seat'?'You are on the returning list. Seats are given out Monday at 05:00.':'Registration opens Monday at 06:00.');
    return sc('var(--gray)','info','No seat this Saturday',f.nextWeek==='seat'?'You are on the list for next Monday.':'Register again to get a seat.');}
  const canAnswer=[P.WED,P.THU12].includes(S.phase);
  const btns='<button class="btn green" data-act="confirm">Confirm</button><button class="btn gray" data-act="pause">Pause this week</button>';
  switch(e.conf){
    case 'reserved':return canAnswer?sc('var(--orange)','clock','Will you come on Saturday?','Answer by Thursday 12:00 or the seat is released.',btns):sc('var(--tint)','clock','Seat reserved','We will ask you to confirm on Wednesday at 17:00.','<button class="btn gray" data-act="pause">Pause this week</button>');
    case 'offered':return sc('var(--orange)','hourglass','A seat opened for you','Confirm by Thursday 18:00 to keep it.',btns);
    case 'confirmed':
      if(S.phase>=P.GATE){if(e.gate==='entered')return sc('var(--green)','check','You are in','Enjoy your meal.');
        return S.phase===P.GATE?sc('var(--green)','fp','Gate is open','Show this pass or scan your finger at the gate.'):sc('var(--red)','x','Gate closed at 12:45','Late arrivals cannot enter.');}
      return sc('var(--green)','check','Confirmed for Saturday','Arrive by 12:30pm. The gate closes at 12:45.',S.phase<=P.THU12?'<button class="btn gray" data-act="pause">I can no longer come</button>':'');
    case 'paused':return sc('var(--indigo)','pause','Paused this week','Your place is kept. You are back on the list next Monday.');
    case 'released':return e.lapsed?sc('var(--gray)','info','Offer lapsed','You did not confirm the offered seat in time. No penalty; you are on the list next Monday.'):sc('var(--red)','x','Seat released','You did not confirm by Thursday 12:00. Missed count: '+f.missCount+' of 3.');}
  return '';}

/* ---------- gate ---------- */
function gateV(){const loc=S.gate.loc;
  const confirmed=entries().filter(e=>e.loc===loc&&e.conf==='confirmed'),inF=confirmed.filter(e=>e.gate==='entered');
  const guests=a=>a.reduce((s,e)=>s+S.families[e.code].members.length,0);
  const st=S.phase===P.GATE?'<span class="pill green">Open until 12:45</span>':S.phase<P.GATE?'<span class="pill">Opens Saturday 12:30</span>':'<span class="pill red">Closed at 12:45</span>';
  const r=ui.gateResult;
  return '<div class="row" style="margin-top:8px"><h1 class="lt grow">Gate</h1>'+st+'</div>'+'<div class="group">'+hallPicker('gate')+'</div>'+
  (r?'<div style="margin-top:16px">'+gateResultV(r)+'</div>':'<div class="gatebtns" style="margin-top:16px"><button class="gatebtn" data-act="gateFp">'+tile('fp','var(--tint)',null,34)+'Scan fingerprint</button><button class="gatebtn" data-act="gateCode">'+tile('hash','var(--indigo)',null,30)+'Enter family code</button></div>')+
  '<div class="stats"><div class="stat"><b>'+inF.length+'<span style="font-size:18px;color:var(--label2)"> / '+confirmed.length+'</span></b><span>families in</span></div><div class="stat"><b>'+guests(inF)+'<span style="font-size:18px;color:var(--label2)"> / '+guests(confirmed)+'</span></b><span>guests in</span></div></div>'+
  sec('',toggleRow('','Offline mode',S.gate.offline?'Checking against the list cached '+S.gate.lastSync+'. '+S.gate.queue.length+' waiting to sync.':'Works without network using the cached list.',S.gate.offline,' data-act="offline"'));}
function gateResultV(r){
  if(!r.ok)return '<section class="result no" role="alert"><div class="big-ic">'+I('x',40,3)+'</div><h2>'+esc(r.title)+'</h2><p>'+esc(r.reason)+'</p>'+(r.f?'<p style="opacity:.8;font-size:15px">'+esc(r.f.code)+'</p>':'')+'<button class="btn" data-act="gateClear">Next family</button></section>';
  const gs=r.f.members.map(id=>S.guests[id]),pend=gs.filter(g=>g.fpStatus==='pending');
  return '<section class="result ok" role="alert"><div class="big-ic">'+I('check',42,3)+'</div><h2>Matched. Enter.</h2><p>'+allocText(r.e,false)+'</p><p style="opacity:.8;font-size:15px">'+esc(r.f.code)+', '+gs.length+' '+(gs.length>1?'people':'person')+', by '+esc(r.via)+(S.gate.offline?', saved offline':'')+'</p>'+
  '<div class="faces">'+gs.map(g=>'<div class="face">'+avatar(g,54)+'<span>'+esc(g.first)+'</span></div>').join('')+'</div>'+
  (pend.length?'<div class="enrol"><p style="margin:0 0 10px;font-weight:600">Take pending fingerprints</p><div class="row wrap" style="justify-content:center">'+pend.map(g=>'<button class="btn" data-act="gateEnrol" data-v="'+g.id+'">'+esc(g.first)+'</button>').join('')+'</div></div>':'')+
  '<button class="btn" data-act="gateClear">Next family</button></section>';}
function gateVerify(q){const loc=S.gate.loc;let f=null,via;
  const no=(title,reason,fam)=>({ok:false,title,reason,f:fam||null});
  if(q.fp){const o=fpOwner(q.fp);via='fingerprint';if(!o)return no('Not recognised','This fingerprint is not enrolled. Send the family to the registration desk.');f=o.f;}
  else{const c=String(q.code||'').trim().toUpperCase();via='family code';f=S.families[c];if(!f)return no('Code not found','No family has the code '+(c||'(blank)')+'.');}
  if(f.status==='removed'&&!S.list[f.code])return no('Not registered','This family was removed after 3 missed Saturdays. They must register again.',f);
  if(S.phase!==P.GATE)return no(S.phase<P.GATE?'Gate not open':'Gate closed',S.phase<P.GATE?'The gate opens Saturday at 12:30.':'The gate closed at 12:45. Late arrivals cannot enter.',f);
  if(f.loc!==loc)return no('Wrong hall','This family is registered at '+LOC(f.loc).name+'.',f);
  const e=S.list[f.code];
  if(!e)return no('Not on today\u2019s list','This family has no seat this Saturday.',f);
  if(e.conf==='paused')return no('Paused this week','The family chose to pause. Their place returns next week.',f);
  if(e.conf!=='confirmed')return no('Not confirmed','The family did not confirm in time, so the seat was released.',f);
  if(e.gate==='entered')return no('Already entered','This family came in at '+e.time+'. No second entry.',f);
  const n=entries().filter(x=>x.gate==='entered').length;
  e.gate='entered';e.time='12:'+pad(Math.min(44,30+Math.floor(n/3)),2);
  if(S.gate.offline)S.gate.queue.push({code:f.code,time:e.time});
  return {ok:true,f,e,via};}

   '<p class="gf" id="hallnone" style="display:none;text-align:center;padding-top:30px">No hall matches that search.</p>');}
function filterHalls(q){q=q.trim().toLowerCase();let any=false;

  document.querySelectorAll('#sheet .hz').forEach(s=>{s.style.display=[...s.querySelectorAll('[data-q]')].some(b=>b.style.display!=='none')?'':'none';});

function hallSummary(rows){const by={};rows.forEach(r=>{const k=r.sp.loc;(by[k]=by[k]||{t:0,paid:0,conf:0,cook:0});by[k].t++;by[k].paid+=r.sp.cap;by[k].conf+=r.conf;by[k].cook+=r.cook;});

function hallsAdminSec(){const nh=ui.newHall||(ui.newHall={name:'',state:''});
  return sec('Halls',ZONES.map(z=>valRow(z,halls().filter(h=>h.zone===z).length+' halls')).join('')+valRow('Total',halls().length+' halls',true))+
  sec('Add a hall',fieldRow('City or area','nhn','newHall.name',nh.name,'placeholder="e.g. Ikorodu"')+selectRow('State','nhs','newHall.state',Object.keys(STATES).sort(),nh.state)+actRow('addHall','','Add hall','building'),'The new hall is available for tables, registration and the gate straight away.');}
function addHall(){const nh=ui.newHall||{};const name=(nh.name||'').trim(),state=nh.state;
  if(!name||!STATES[state]){toast('Enter a city or area and choose a state.','warn');return;}
  if(halls().some(h=>h.name.toLowerCase()===name.toLowerCase())){toast('There is already a hall called '+name+'.','warn');return;}
  const base=(name.replace(/[^A-Za-z]/g,'').toUpperCase()+'XXX').slice(0,3);let id=base;const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let i=0;halls().some(h=>h.id===id)&&i<26;i++)id=base.slice(0,2)+A[i];
  S.halls.push({id,name,state,zone:STATES[state],hall:'GTN Hall, '+name+', '+state});ui.newHall={name:'',state:''};save();render();toast(name+' hall added ('+id+').');}

/* ---------- operations ---------- */
function opsV(){return ({kitchen:kitchenV,farm:farmV,skills:skillsV,admin:adminV}[ui.tab]||kitchenV)();}
function kitchenRows(loc){return activeSps(loc).map(sp=>{
  const seated=used(sp.id),conf=seatsAt(sp.id,e=>e.conf==='confirmed'),paused=seatsAt(sp.id,e=>e.conf==='paused'),rel=seatsAt(sp.id,e=>e.conf==='released'),ent=seatsAt(sp.id,e=>e.gate==='entered');
  return {sp,seated,conf,paused,rel,ent,cook:S.locked&&S.snap[sp.id]?S.snap[sp.id].cook:conf};}).sort((a,b)=>a.sp.id.localeCompare(b.sp.id));}

function act(name,el){if(H[name])H[name](el);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closeSheet'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="closeSheet"]'))return;
  if(el.tagName==='INPUT'){if(el.type==='checkbox'&&el.dataset.act==='offline')act('offline',el);return;}
  e.preventDefault();act(el.dataset.act,el);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').innerHTML)closeSheet();});
function bind(el){const k=el.dataset.bind;if(!k)return;const v=el.type==='checkbox'?el.checked:el.value;
  if(k.startsWith('host.'))hostForm[k.slice(5)]=v;
  else if(k==='hf.custom'){hf.custom=v.replace(/\D/g,'');}
  else if(k.startsWith('rf.'))rf[k.slice(3)]=v;
  else if(k.startsWith('m.')){const [,i,f]=k.split('.');rf.members[+i][f]=v;if(f==='child')render();}
  else if(k==='me.evId'){S.me.evId=v.trim().toUpperCase()||'EV-1';save();}
  else if(k==='me.usherId'){S.me.usherId=v.trim().toUpperCase()||'HD-1';save();}
  else if(k==='ui.codeLookup')ui.codeLookup=v;
  else if(k.startsWith('newHall.')){ui.newHall=ui.newHall||{name:'',state:''};ui.newHall[k.slice(8)]=v;}
  else if(k.startsWith('recipe.')){const n=parseFloat(v);if(!isNaN(n)&&n>=0){S.cfg.recipe[+k.split('.')[1]].per=n;save();}}
  else if(k==='farmChickens'){S.cfg.farmChickens=parseInt(v,10)||0;save();}
  else if(k==='platePrice'){const n=parseInt(v,10);if(n>0){S.cfg.platePrice=n;save();}}}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hallq'){filterHalls(t.value);return;}if(t.dataset&&t.dataset.bind&&t.type!=='checkbox'&&t.tagName!=='SELECT')bind(t);});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.bind){bind(t);if(['hf.custom','recipe','farmChickens','platePrice','me.evId'].some(p=>t.dataset.bind.startsWith(p)))render();return;}
  if(t.dataset&&t.dataset.photo!=null&&t.files&&t.files[0]){const i=+t.dataset.photo;const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=112;c.width=s;c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);rf.members[i].photo=c.toDataURL('image/jpeg',.72);render();};img.src=rd.result;};rd.readAsDataURL(t.files[0]);}});

/* ---------- onboarding & auth UI (injected) ---------- */
// inject lightweight styles for splash/onboard/auth
function _injectUiExtras(){try{
  const css=`
  /* Splash & modals */
  #splash{position:fixed;inset:0;background:linear-gradient(180deg,rgba(250,250,252,0.95),rgba(245,245,249,0.98));display:flex;align-items:center;justify-content:center;z-index:140}
  #splash .s-card{max-width:720px;width:calc(100% - 48px);background:var(--card);border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.12);text-align:center}
  #splash .s-card h1{margin:0 0 8px;font-size:26px}
  #splash .s-card p{color:var(--label2);margin:0 0 18px}
  #splash .s-actions{display:flex;gap:12px;justify-content:center;margin-top:10px}
  /* Simple form inputs in sheets */
  .sheet .field-row{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .sheet input[type="text"],.sheet input[type="email"],.sheet input[type="password"]{padding:10px 12px;border-radius:10px;border:1px solid var(--sep);background:transparent;color:var(--label)}
  .sheet label{font-size:13px;color:var(--label2)}
  .onboard-step{padding:8px 0 14px}
  `;
  const s=document.createElement('style');s.setAttribute('data-added','gtn-ui-extras');s.textContent=css;document.head.appendChild(s);
}catch(e){console.error('ui extras failed',e);} }

// splash element (shown once per install unless skipped)
function _createSplash(){if(document.getElementById('splash'))return;const s=document.createElement('div');s.id='splash';s.innerHTML=''+
  '<div class="s-card" role="dialog" aria-modal="true" aria-label="GTN welcome">'+
    '<img src="'+LOGO.gtn+'" alt="GTN" style="width:84px;height:84px;border-radius:18px;margin-bottom:14px;">'+
    '<h1>Welcome to GTN Dining</h1>'+
    '<p>Saturday meals, organised locally. A quick tour will show how to register families, pay for a table, and run the day.</p>'+
    '<div class="s-actions">'+
      '<button class="btn tinted" data-act="splash-skip">Skip</button>'+
      '<button class="btn" data-act="splash-start">Take tour</button>'+
      '<button class="btn gray" data-act="splash-auth">Sign in</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(s);
  s.querySelector('[data-act="splash-skip"]').addEventListener('click',()=>{localStorage.setItem(LS+'-splash','1');s.remove();});
  s.querySelector('[data-act="splash-start"]').addEventListener('click',()=>{localStorage.setItem(LS+'-splash','1');s.remove();_showOnboard();});
  s.querySelector('[data-act="splash-auth"]').addEventListener('click',()=>{s.remove();_showAuth('signin');});
}

// onboarding flow (uses existing openSheet)
function _showOnboard(){
  const steps=[
    {t:'Register families',d:'Quickly register a family and get them a seat. Use the guest flow to capture members and phone.'},
    {t:'Pay for tables',d:'Hosts can pay for tables and choose if they remain anonymous. Payments are simulated in this prototype.'},
    {t:'Gate & live',d:'On Saturday use the Gate screen to verify families and mark them in. Live video is simulated.'}
  ];
  let i=0;
  function renderStep(){
    const s=steps[i];
    const html='<div class="onboard-step"><h2 class="title3">'+esc(s.t)+'</h2><p class="fn">'+esc(s.d)+'</p></div>'+
      '<div style="display:flex;gap:10px;margin-top:18px;justify-content:space-between"><button class="btn gray" data-act="onboard-prev" '+(i===0?'disabled':'')+'>Back</button><div style="display:flex;gap:8px">'+(i<steps.length-1?'<button class="btn tinted" data-act="onboard-next">Next</button>':'<button class="btn" data-act="onboard-done">Finish</button>')+'</div></div>';
    openSheet('Welcome to GTN — Tour',html,false);
    const prev=document.querySelector('[data-act="onboard-prev"]'); if(prev)prev.addEventListener('click',()=>{i=Math.max(0,i-1);renderStep();});
    const next=document.querySelector('[data-act="onboard-next"]'); if(next)next.addEventListener('click',()=>{i=Math.min(steps.length-1,i+1);renderStep();});
    const done=document.querySelector('[data-act="onboard-done"]'); if(done)done.addEventListener('click',()=>{localStorage.setItem(LS+'-onboard','1');document.querySelector('#sheet').innerHTML='';});
  }
  renderStep();
}

// simple auth modal (mock) — supports sign-in and sign-up stored in localStorage (no password security)
function _showAuth(mode){
  mode=mode||'signin';
  const html=''+
    '<div><div class="field-row"><label>Email</label><input id="auth-email" type="email" autocomplete="email"></div>'+
    (mode==='signup'?'<div class="field-row"><label>Full name</label><input id="auth-name" type="text" autocomplete="name"></div>':'')+
    '<div class="field-row"><label>Password</label><input id="auth-pass" type="password" autocomplete="current-password"></div>'+
    '<div class="btns" style="margin-top:12px"><button class="btn" data-act="auth-submit">'+(mode==='signup'?'Create account':'Sign in')+'</button><button class="btn gray" data-act="auth-cancel">Cancel</button></div>'+
    (mode==='signin'?'<p class="fn" style="margin-top:12px">New here? <button class="btn sm tinted" data-act="auth-switch">Create an account</button></p>':'<p class="fn" style="margin-top:12px">Already have an account? <button class="btn sm tinted" data-act="auth-switch">Sign in</button></p>')+
    '</div>';
  openSheet(mode==='signup'?'Create account':'Sign in',html,false);
  document.querySelector('[data-act="auth-cancel"]').addEventListener('click',()=>{document.querySelector('#sheet').innerHTML='';});
  document.querySelector('[data-act="auth-switch"]').addEventListener('click',()=>{document.querySelector('#sheet').innerHTML='';_showAuth(mode==='signup'?'signin':'signup');});
  document.querySelector('[data-act="auth-submit"]').addEventListener('click',()=>{
    const email=(document.getElementById('auth-email')||{}).value||'';
    const pass=(document.getElementById('auth-pass')||{}).value||'';
    const name=(document.getElementById('auth-name')||{}).value||'';
    if(!email||!pass){toast('Email and password required','info');return;}
    try{
      const users=JSON.parse(localStorage.getItem(LS+'-users')||'{}');
      if(mode==='signup'){
        if(users[email]){toast('Account already exists','warn');return;}
        users[email]={email,pass,name}; localStorage.setItem(LS+'-users',JSON.stringify(users));
        // set current user in app state
        S.me=S.me||{}; S.me.user={email:email,name:name,id:email}; save(); render(); toast('Account created and signed in as '+(name||email),'ok');
      } else {
        const u=users[email]; if(!u||u.pass!==pass){toast('Invalid credentials','warn');return;} 
        S.me=S.me||{}; S.me.user={email:u.email,name:u.name,id:u.email}; save(); render(); toast('Signed in as '+(u.name||u.email),'ok');
      }
    }catch(e){console.error(e);}
    document.querySelector('#sheet').innerHTML='';
  });
}

// helper to decide whether to show splash/onboarding/auth at boot
function _maybeShowIntro(){try{
  const seenSplash=localStorage.getItem(LS+'-splash');
  const seenOnboard=localStorage.getItem(LS+'-onboard');
  if(!seenSplash){_createSplash();return;} // splash first
  if(!seenOnboard){_showOnboard();}
}catch(e){console.error(e);}}

// expose small helpers to other UI actions (used by splash buttons)
window.__gtn_ui = {showAuth:_showAuth, showOnboard:_showOnboard};

/* ---------- boot ---------- */
try{const t=localStorage.getItem(LS+'-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t;}catch(e){}
S=load()||seed();save();
try{if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').then(()=>console.log('SW registered')).catch(()=>{});}}catch(e){}
try{const m=JSON.parse(localStorage.getItem(LS+'-ui')||'null');if(m&&MODES[m.mode]){ui.mode=m.mode;ui.tab=m.tab;ui.opsLoc=m.opsLoc||'ALL';if(['guest','evangelist','hall'].includes(m.mode))rf=newRF(m.mode==='guest'?'self':m.mode);}}catch(e){}
$('#toast').hidden=true;
render();
// initialize injected UI extras and show intro flows if needed
try{_injectUiExtras();_maybeShowIntro();}catch(e){/* no-op if helpers missing */}
})();
